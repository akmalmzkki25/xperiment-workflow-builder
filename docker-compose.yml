services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: xperiment
      POSTGRES_PASSWORD: xperiment
      POSTGRES_DB: xperiment
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xperiment"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      # 6379 falls inside a Windows excluded port range (WinNAT); 16379 avoids it
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
